<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6 border border-slate-200">
        <div class="text-center space-y-1">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Welcome Back</h1>
            <p class="text-xs text-slate-400">Log in to track your HSK execution portfolio</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div id="flashMessage" class="p-3.5 rounded-xl text-xs font-bold {% if category == 'danger' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="username" name="username" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-blue-500 font-medium">
            </div>
            <div class="relative">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" name="password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-blue-500 font-medium pr-10">
                <button type="button" onclick="togglePasswordVisibility('password')" class="absolute right-3 top-[38px] text-xs font-bold text-blue-600 hover:text-blue-800">Show</button>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-3.5 rounded-xl transition shadow-md uppercase tracking-wider">
                Authenticate Secure Session
            </button>
        </form>
        <p class="text-center text-xs font-medium text-slate-500">
            New here? <a href="/signup" class="text-blue-600 font-bold hover:underline">Create an Account</a>
        </p>
    </div>

    <script>
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            const btn = field.nextElementSibling;
            if (field.type === "password") {
                field.type = "text";
                btn.innerText = "Hide";
            } else {
                field.type = "password";
                btn.innerText = "Show";
            }
        }
    </script>
</body>
</html>
