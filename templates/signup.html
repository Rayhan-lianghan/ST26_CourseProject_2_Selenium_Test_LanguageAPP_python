<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-5 border border-slate-200">
        <div class="text-center space-y-1">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Create Account</h1>
            <p class="text-xs text-slate-400">Initialize terminal data registration profiles</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3 bg-red-50 text-red-700 border border-red-200 rounded-xl text-xs font-bold">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/signup" method="POST" class="space-y-3.5">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="username" name="username" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500 font-medium">
            </div>
            <div class="relative">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" name="password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500 font-medium pr-10">
                <button type="button" onclick="togglePasswordVisibility('password')" class="absolute right-3 top-7 text-xs font-bold text-blue-600 hover:text-blue-800">Show</button>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500 font-medium">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Phone Number</label>
                <input type="text" id="phone" name="phone" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500 font-medium" placeholder="e.g., +86 188...">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Gender</label>
                <select id="gender" name="gender" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500 font-medium">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-3 rounded-xl transition uppercase tracking-wider">
                Deploy System Register Node
            </button>
        </form>
        <p class="text-center text-xs font-medium text-slate-500">
            Have an account? <a href="/login" class="text-blue-600 font-bold hover:underline">Log In</a>
        </p>
    </div>

    <script>
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            const btn = field.nextElementSibling;
            if (field.type === "password") {
                field.type = "text";
                btn.innerText = "Hide";
            } else {
                field.type = "password";
                btn.innerText = "Show";
            }
        }
    </script>
</body>
</html>
