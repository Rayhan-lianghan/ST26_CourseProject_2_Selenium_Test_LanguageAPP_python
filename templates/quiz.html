<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Examination Deck | Locked Secure State</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-2xl p-8 border border-slate-200 shadow-2xl space-y-6">
        
        <div class="flex items-start justify-between gap-4 border-b border-slate-100 pb-4">
            <div>
                <span class="bg-red-100 text-red-700 text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full">Secure Exam Mode</span>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight mt-2">HSK Level 4 Simulated Assessment</h1>
            </div>
            <div class="bg-red-50 text-red-600 border border-red-200 rounded-xl px-3 py-2 text-center min-w-[70px]">
                <p class="text-[8px] font-bold uppercase tracking-wider text-slate-400">Timer</p>
                <p id="examTimer" class="font-mono text-xs font-black">45:00</p>
            </div>
        </div>

        <form id="quizForm" action="/quiz" method="POST" class="space-y-5">
            <div class="bg-slate-50 border p-4 rounded-xl space-y-2">
                <p class="text-sm font-bold text-slate-800">1. Select the correct meaning for the word "考试" (kǎoshì):</p>
                <div class="space-y-2">
                    <label class="choice-container flex items-center space-x-3 text-xs bg-white p-3 rounded-lg border cursor-pointer hover:bg-slate-100 transition">
                        <input type="radio" name="q1" value="A" required onclick="highlightSelection(this)" class="w-4 h-4 text-blue-600">
                        <span class="font-medium text-slate-700">Exam / Test / Assessment Matrix</span>
                    </label>
                    <label class="choice-container flex items-center space-x-3 text-xs bg-white p-3 rounded-lg border cursor-pointer hover:bg-slate-100 transition">
                        <input type="radio" name="q1" value="B" onclick="highlightSelection(this)" class="w-4 h-4 text-blue-600">
                        <span class="font-medium text-slate-700">To clean up a workshop room</span>
                    </label>
                </div>
            </div>

            <div class="bg-slate-50 border p-4 rounded-xl space-y-2">
                <p class="text-sm font-bold text-slate-800">2. Complete the statement: "通过HSK四级是我们在常州大学毕业的硬性____。"</p>
                <div class="space-y-2">
                    <label class="choice-container flex items-center space-x-3 text-xs bg-white p-3 rounded-lg border cursor-pointer hover:bg-slate-100 transition">
                        <input type="radio" name="q2" value="A" required onclick="highlightSelection(this)" class="w-4 h-4 text-blue-600">
                        <span class="font-medium text-slate-700">学习 (xuéxí)</span>
                    </label>
                    <label class="choice-container flex items-center space-x-3 text-xs bg-white p-3 rounded-lg border cursor-pointer hover:bg-slate-100 transition">
                        <input type="radio" name="q2" value="B" onclick="highlightSelection(this)" class="w-4 h-4 text-blue-600">
                        <span class="font-medium text-slate-700">要求 (yāoqiú)</span>
                    </label>
                </div>
            </div>

            <button id="submitQuizBtn" type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-3.5 rounded-xl transition shadow-md uppercase tracking-widest">
                Submit Examination Answers
            </button>
        </form>
    </div>

    <script>
        let secondsTotal = 45 * 60;
        const display = document.getElementById("examTimer");
        
        const trackingInterval = setInterval(() => {
            let minutes = Math.floor(secondsTotal / 60);
            let seconds = secondsTotal % 60;
            display.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (--secondsTotal < 0) {
                clearInterval(trackingInterval);
                window.onbeforeunload = null;
                document.getElementById("quizForm").submit();
            }
        }, 1000);

        function highlightSelection(radio) {
            const containers = radio.closest('.space-y-2').querySelectorAll('.choice-container');
            containers.forEach(c => c.classList.remove('border-blue-500', 'bg-blue-50'));
            radio.closest('.choice-container').classList.add('border-blue-500', 'bg-blue-50');
        }

        // Intercept accidental exit loops
        window.onbeforeunload = function() {
            return "An active test session is running. Progress will be wiped if you navigate away.";
        };
        document.getElementById("quizForm").onsubmit = function() {
            window.onbeforeunload = null;
        };
    </script>
</body>
</html>
