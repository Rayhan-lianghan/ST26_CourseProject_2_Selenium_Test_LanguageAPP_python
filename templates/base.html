<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Language Learning App</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-50 font-sans min-h-screen">
<nav class="bg-red-600 text-white p-4 flex justify-between">
<a href="{{ url_for('dashboard') }}" class="font-bold">Dashboard 控制面板</a>
{% if session.get('user_id') %}
<a href="{{ url_for('logout') }}">Logout 登出</a>
{% endif %}
</nav>
<div class="p-6">
{% with messages = get_flashed_messages() %}
  {% if messages %}
  <ul>
    {% for msg in messages %}
      <li class="text-red-700">{{ msg }}</li>
    {% endfor %}
  </ul>
  {% endif %}
{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
